spring.datasource.url=jdbc:mysql://localhost:3306/tuckedinplace?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=change-this-to-a-long-random-string-at-least-32-characters
jwt.expiration-ms=86400000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_USERNAME:no-reply@tuckedinplace.local}
app.frontend-url=http://localhost:5173
app.reset-token-minutes=30